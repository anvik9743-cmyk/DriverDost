services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: driverdost, POSTGRES_USER: driverdost, POSTGRES_PASSWORD: change-me }
    ports: ["5432:5432"]
    volumes: ["./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
  api:
    build: ./server
    environment: { PORT: 4000, DATABASE_URL: "postgresql://driverdost:change-me@db:5432/driverdost" }
    ports: ["4000:4000"]
    depends_on: [db]
