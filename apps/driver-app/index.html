<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriverDost Driver</title>
<style>body{font-family:system-ui;margin:0;background:#111827;color:#f9fafb}main{max-width:720px;margin:auto;padding:20px}.card{background:#1f2937;border-radius:14px;padding:16px;margin:12px 0}button{padding:11px 16px;border:0;border-radius:9px;background:#22c55e;font-weight:700;cursor:pointer;margin:4px}</style></head>
<body><main><h1>Driver App — DriverDost</h1><p>✓ Identity Verified · ✓ Licence Verified · ✓ Background Check Completed<br>Status: <b>Online</b> · Today's earnings dashboard updates on trip completion.</p>
<div class="card"><h2>Incoming / Assigned Bookings</h2><div id="list">Loading…</div></div></main>
<script>async function load(){const bs=await(await fetch('/api/bookings')).json();list.innerHTML=bs.length?bs.map(b=>`<div class="card"><b>#${b.id} ${b.serviceType}</b> — ${b.pickup} → ${b.destination||'—'}<br>${b.hours} hrs · You earn ₹${b.driverEarnings} · Status: ${b.status}<br><button onclick="act(${b.id},'arrived')">Arrived</button><button onclick="act(${b.id},'start')">Start Trip</button><button onclick="act(${b.id},'complete')">Complete Trip</button></div>`).join(''):'No bookings yet — create one in the Customer view.'}
async function act(id,a){await fetch(`/api/bookings/${id}/${a}`,{method:'POST'});load()} load();</script></body></html>
